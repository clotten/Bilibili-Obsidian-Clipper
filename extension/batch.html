<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>合集学习笔记</title>
  <link rel="stylesheet" href="./batch.css" />
</head>
<body>
  <main class="batch-app">
    <header class="batch-header">
      <div>
        <h1>合集学习笔记</h1>
        <p>AI 提供标题分组建议，人工确认后分别生成视频笔记和小合集教程</p>
      </div>
      <button id="openOptionsBtn" class="secondary">设置</button>
    </header>

    <section class="card controls">
      <label>合集入口 BV 号或视频地址
        <div class="inline"><input id="bvidInput" type="text" placeholder="BV1gb42177hm" /><button id="discoverBtn" class="primary">读取合集</button></div>
      </label>
      <div class="grid">
        <label>AI 模型<select id="providerSelect"><option value="">加载中...</option></select></label>
        <label>Obsidian 根目录<input id="folderInput" type="text" value="Clippings/Bilibili" /></label>
      </div>
      <p id="obsidianStatus" class="hint">正在检查 Obsidian 连接...</p>
      <p class="hint">会自动写入当前打开的 Obsidian 仓库，并自动建立课程和小合集目录；不需要手动创建文件夹。</p>
    </section>

    <section id="courseCard" class="card" hidden>
      <div class="course-head"><div><h2 id="courseTitle"></h2><p id="courseMeta"></p></div><div class="course-actions"><button id="aiGroupBtn" class="secondary" type="button">AI 分组建议</button><button id="addGroupBtn" class="secondary" type="button">新增小合集</button><button id="runBtn" class="primary" disabled>生成视频笔记</button></div></div>
      <div class="group-actions">
        <span>左侧=处理视频，右侧=合成教程：</span>
        <button id="selectAllGroupsBtn" class="secondary" type="button">全选</button>
        <button id="selectNoGroupsBtn" class="secondary" type="button">全不选</button>
      </div>
      <div id="groupList" class="group-list"></div>
      <div class="video-assignment-head"><strong>人工调整视频归属</strong><span>每个视频都可以改到任意小合集</span></div>
      <div id="videoAssignmentList" class="video-assignment-list"></div>
      <div class="aggregate-options">
        <label><input id="aggregateIncludeSubtitles" type="checkbox" /> 合成小合集时同时加入原始字幕（更耗 Token）</label>
        <textarea id="aggregatePrompt" placeholder="可选：填写小合集教程的额外要求，例如“重点讲清代码执行流程，增加复习清单”。"></textarea>
      </div>
      <p class="hint">AI 分组只根据标题提出建议；你可以修改小合集名称、添加小合集，或在下方调整每个视频归属。视频笔记和小合集教程分开生成。</p>
    </section>

    <section id="progressCard" class="card" hidden>
      <div class="progress-row"><span id="progressText">等待开始</span><span id="progressCount"></span></div>
      <progress id="progressBar" value="0" max="1"></progress>
      <div class="progress-actions"><button id="startBtn" class="primary" type="button">开始/继续生成视频笔记</button><button id="aggregateBtn" class="secondary" type="button">合成已勾选小合集</button><button id="pauseBtn" class="secondary" type="button">暂停</button><button id="clearCheckpointBtn" class="secondary" type="button">清除断点</button></div>
      <pre id="log"></pre>
    </section>

    <section id="failedCard" class="card" hidden>
      <h2>失败清单</h2>
      <p class="hint">没有字幕或 AI/网络失败的视频会列在这里，不会阻塞其他视频。</p>
      <div id="failedList"></div>
    </section>
  </main>
  <script src="./batch.js"></script>
</body>
</html>
